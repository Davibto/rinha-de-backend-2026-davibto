worker_processes auto;
worker_rlimit_nofile 500000;

events {
    use epoll;
    worker_connections 5000;
}

http {
    access_log off;
    
    upstream api {
        server api1:8080;
        server api2:8080;
        keepalive 200;
    }

    server {
        listen 9999;

        location / {
            proxy_pass http://api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }
    }
}
version: '3.5'

services:
  api1:
    build: .
    ports:
      - "8081:8080" 
    environment:
      - DOTNET_GCHeapHardLimitPercent=70 
      - DOTNET_GCHighMemPercent=80      
    deploy:
      resources:
        limits:
          cpus: '0.4'
          memory: '150MB'

  api2:
    build: .
    ports:
      - "8082:8080" 
    environment:
      - DOTNET_GCHeapHardLimitPercent=70 
      - DOTNET_GCHighMemPercent=80      
    deploy:
      resources:
        limits:
          cpus: '0.4'
          memory: '150MB'

  nginx:
    image: nginx:alpine
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "9999:9999" 
    depends_on:
      - api1
      - api2
    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: '50MB'